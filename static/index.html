<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptaAI - Gerador Inteligente de Documentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <h1 class="brand">ScriptaAI</h1>
        <button type="button" id="theme-toggle" class="btn-theme">Modo escuro</button>
    </header>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <h2>Configurações</h2>

            <section class="sidebar-section">
                <h3>Entradas de conteúdo</h3>

                <label class="field-label" for="prompt-input">Prompt</label>
                <textarea id="prompt-input" class="field" rows="4"
                          placeholder="Descreva o documento que você deseja gerar..."></textarea>

                <label class="field-label" for="links-input">Links (artigos, Wikipédia, YouTube)</label>
                <textarea id="links-input" class="field" rows="3"
                          placeholder="Cole um link por linha"></textarea>

                <span class="field-label">Arquivos fonte</span>
                <label class="upload-zone" for="file-input">
                    <span>Clique para selecionar arquivos</span>
                    <small>.txt, .md, .docx, .mp3, .mp4</small>
                    <input type="file" id="file-input" multiple
                           accept=".txt,.md,.docx,.mp3,.mp4" hidden>
                </label>
            </section>

            <section class="sidebar-section">
                <h3>Formatação</h3>

                <div class="norm-grid" role="radiogroup" aria-label="Norma de formatação">
                    <label class="norm-card">
                        <input type="radio" name="norm" value="abnt" checked>
                        <span class="norm-body">
                            <span class="norm-title">ABNT</span>
                            <span class="norm-desc">Trabalhos acadêmicos brasileiros</span>
                        </span>
                    </label>

                    <label class="norm-card">
                        <input type="radio" name="norm" value="apa-ieee">
                        <span class="norm-body">
                            <span class="norm-title">APA / IEEE</span>
                            <span class="norm-desc">Textos técnicos e científicos</span>
                        </span>
                    </label>

                    <label class="norm-card">
                        <input type="radio" name="norm" value="executivo">
                        <span class="norm-body">
                            <span class="norm-title">Executivo Moderno</span>
                            <span class="norm-desc">Relatórios e documentos corporativos</span>
                        </span>
                    </label>

                    <label class="norm-card">
                        <input type="radio" name="norm" value="apostila">
                        <span class="norm-body">
                            <span class="norm-title">Apostila Compacta</span>
                            <span class="norm-desc">Material didático enxuto</span>
                        </span>
                    </label>
                </div>
            </section>

            <section class="sidebar-section">
                <h3>Tipografia</h3>

                <div class="field-row">
                    <div>
                        <label class="field-label" for="font-select">Fonte</label>
                        <select id="font-select" class="field">
                            <option value="arial" selected>Arial</option>
                            <option value="times">Times New Roman</option>
                            <option value="roboto">Roboto</option>
                            <option value="monospace">Monospace</option>
                        </select>
                    </div>

                    <div>
                        <label class="field-label" for="size-select">Tamanho</label>
                        <select id="size-select" class="field">
                            <option value="10">10 pt</option>
                            <option value="11">11 pt</option>
                            <option value="12" selected>12 pt</option>
                            <option value="13">13 pt</option>
                            <option value="14">14 pt</option>
                        </select>
                    </div>
                </div>

                <label class="field-label" for="margin-select">Densidade de margem</label>
                <select id="margin-select" class="field">
                    <option value="narrow">Estreita</option>
                    <option value="normal" selected>Normal</option>
                    <option value="wide">Larga</option>
                </select>
            </section>

            <section class="sidebar-section">
                <h3>Capa</h3>

                <details class="cover-details">
                    <summary>Dados da capa</summary>

                    <div class="cover-body">
                        <label class="field-label" for="cover-title">Título</label>
                        <input type="text" id="cover-title" class="field" placeholder="Título do documento">

                        <label class="field-label" for="cover-subtitle">Subtítulo</label>
                        <input type="text" id="cover-subtitle" class="field" placeholder="Subtítulo (opcional)">

                        <label class="field-label" for="cover-author">Autor</label>
                        <input type="text" id="cover-author" class="field" placeholder="Nome do autor">

                        <label class="field-label" for="cover-institution">Instituição</label>
                        <input type="text" id="cover-institution" class="field" placeholder="Instituição (opcional)">
                    </div>
                </details>
            </section>

            <section class="sidebar-section">
                <h3>Imagens e fórmulas</h3>

                <label class="field-label" for="image-size-select">Tamanho das imagens</label>
                <select id="image-size-select" class="field">
                    <option value="30">Pequeno (30%)</option>
                    <option value="60" selected>Médio (60%)</option>
                    <option value="100">Largura total (100%)</option>
                </select>

                <label class="field-label" for="image-layout-select">Disposição</label>
                <select id="image-layout-select" class="field">
                    <option value="below" selected>Abaixo do texto</option>
                    <option value="side">Texto ao lado (2 colunas)</option>
                    <option value="center">Centralizado</option>
                </select>
            </section>
        </aside>

        <main class="main-panel" id="main-panel">
            <h2>Pré-visualização</h2>
            <div class="preview-placeholder">
                O preview A4 será adicionado em etapa futura.
            </div>
        </main>
    </div>

    <footer class="footer">
        <span>&copy; 2026 ScriptaAI. Todos os direitos reservados.</span>
        <a href="#privacidade">Política de Privacidade &amp; Termos (LGPD)</a>
    </footer>

    <script src="js/app.js" defer></script>
</body>
</html>
